[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveryai-simulation-engine"
version = "0.3.0"
description = "Offline, reproducible synthetic subscription recovery research engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=17,<24"]
ml = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "hypothesis>=6.100,<7"]

[project.scripts]
recoveryai-sim = "recoveryai_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
