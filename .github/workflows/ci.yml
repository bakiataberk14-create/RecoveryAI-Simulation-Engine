name: Simulation quality gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e .
      - run: python -m pytest -q -o junit_family=xunit2 --junitxml=reports/junit.xml
      - run: python tools/check_junit.py reports/junit.xml
      - run: python -m compileall -q src
      - run: python -m recoveryai_sim generate --invoices 10000 --merchants 30 --output outputs/ci --parquet
      - run: python -m recoveryai_sim validate --input outputs/ci
      - run: python -m recoveryai_sim evaluate --input outputs/ci
      - run: python -m recoveryai_sim oracle-evaluate --input outputs/ci
      - run: python -m recoveryai_sim train --input outputs/ci
      - run: python -m recoveryai_sim generate --config configs/sequential.json --output outputs/sequential --parquet
      - run: python -m recoveryai_sim validate --input outputs/sequential
      - run: python -m recoveryai_sim train --input outputs/sequential
      - run: python -m recoveryai_sim generate --config configs/lifecycle.json --output outputs/lifecycle --parquet
      - run: python -m recoveryai_sim validate --input outputs/lifecycle
      - run: python -m recoveryai_sim compare-policies --config configs/lifecycle.json --seeds 42 --output outputs/lifecycle-comparison
      - run: python -m recoveryai_sim compare-policies --config configs/sequential.json --invoices 1000 --merchants 10 --seeds 42 --output outputs/policy-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-reports-${{ matrix.python-version }}
          path: |
            reports/junit.xml
            outputs/ci/*report.json
            outputs/ci/manifest.json
            outputs/sequential/*report.json
            outputs/sequential/manifest.json
            outputs/lifecycle/*report.json
            outputs/lifecycle/manifest.json
            outputs/lifecycle-comparison/policy_comparison_report.json
            outputs/policy-comparison/policy_comparison_report.json
